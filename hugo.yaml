  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Michael"
    subtitle: "I am a TS/SCI cleared Bilingual Customer Support Engineer"
    content: >-
      As a Team Lead in the Air Force, I served a variety of federal customers, delivered technical training to junior analysts, and translated complex problems into digestible content for senior stakeholders. Additionally, I have hands-on experience in Linux, Kubernetes, networking, GitOps, and observability. I am actively developing my coding and API skills.
    image: /Resume/images/hero.jpg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/michael-resume.pdf"
      download: true
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/That1LinuxGuy
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/michael-allen-vet/
      # customIcons:
        # - icon: /fav.png
        #   url: "https://example.com"

  # About
  about:
    enable: true
    title: "About Me"
    # image: "/images/me.png"
    content: |-
       I am interested in a variety of technologies and love helping customers. I have hands on experience with multiple flavors of Linux, have worked through multiple netwroking issues, dabbled in security, and working with containers & orchestration. I have helped multiple government customers to reach their goals by building high trust relationships and built a modern website for a local business in Decatur Alabama, saving the owner $182/year in website hosting alone.

    skills:
      enable: true
      title: "Customer support, systems, and technical skills"
      items:
       - "Bilingual English/Spanish"
       - "Active TS/SCI (CI Polygraph)"
       - "CompTIA Security+"
       - "RHEL, Debian, NixOS"
       - "Kubernetes, Podman, Docker"
       - "Helm, Kustomize, FluxCD, SOPS"
       - "DNS, Firewalld, reverse proxies"
       - "Git/GitHub Actions"
       - "Prometheus/Grafana"
  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Melodee Designs / Decatur, AL"
        jobs:
          - name: "Technical Support & Web Consultant (Volunteer)"
            date: "Mar 2026 - Present"
            content: |
              Support the production website and business IT environment, maintaining Hugo/Blowfish, custom CSS, Git-based Cloudflare Pages deployments, and production DNS routing. Configured Google Workspace and Cloudflare DNS, including email routing and SPF/DKIM/DMARC authentication, and recommended tools based on operational needs and cost. Integrating Decap CMS for owner-managed updates and designing a self-hosted Baserow costume inventory catalog.

      - company: "U.S. Air Force / Department of Defense / National Security Agency"
        jobs:
          - name: "Operations Support Lead"
            date: "Oct 2025 - Present"
            content: |
              Serve as primary point of contact for four division leaders across a 300+ person organization, resolving documentation, readiness, and inter-service coordination issues. Developed automated inbound/outbound personnel logistics tracking, reducing weekly administrative maintenance overhead by 20%. Maintain 100% data integrity and records accountability across four divisions.
          - name: "Team Lead and Trainer"
            date: "Jun 2023 - Oct 2025"
            content: |
              Managed direct support and coordination for three external customers across multiple time zones, gathering requirements and coordinating follow-ups through secure channels. Authored executive incident summaries and technical reproduction steps connecting tactical analysts with external agency engineers. Led a 15-person team and delivered 200+ hours of technical training, accelerating qualification for 14 analysts by an average of 45 days.
          - name: "Intelligence Analyst"
            date: "Jan 2021 - Jun 2023"
            content: |
              Conducted technical analysis across six global communications networks. Published specialized intelligence reports for 20+ external customer organizations, satisfying six strategic information needs, and briefed senior military leaders (O-4 through O-7) on technical intelligence, operational implications, risks, and recommended actions.

      - company: "Prevent Fire Safety"
        # companyUrl: "https://example.com"
        jobs: 
        - name: "Firestop Technician"
          date: "Apr 2020 to Dec 2020"
          content: |
            I executed precise installation of STI Firestop systems within high-stakes healthcare environments. Additionally, I conducted above-ceiling inspections and remediation, applying intumescent materials to prevent the spread of fire, smoke, and toxic gases across critical building partitions.

      - company: "Tom Thumb"
        companyUrl: "https://local.tomthumb.com/tx/hurst/612-grapevine-hwy.html"
        jobs:
        - name: "Front-End Associate / Cashier"
          date: "2015 – 2017"
          content: |
            I provided efficient service in a high-volume retail environment, managed daily cash drawers and transactions, and collaborated with department leads to streamline checkout processes during peak hours.

